<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Throttling Demo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Throttling Demo</h1>
    <p>
        Move your mouse over the box continuously.
    </p>
    <div id="box">
        Move mouse here
    </div>
    <div class="stats">
        <p>Mousemove events: <span id="eventCount">0</span></p>
        <p>Throttled function calls: <span id="throttleCount">0</span></p>
    </div>

    <script src="throttle.js"></script>

</body>
</html>
